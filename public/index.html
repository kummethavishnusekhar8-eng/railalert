<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>RailAlert — Live IRCTC PNR Status</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      transition: background-color 0.15s ease, border-color 0.15s ease;
      box-sizing: border-box;
    }
    /* Prevent mobile input auto-zoom on iOS */
    @media screen and (max-width: 767px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    html, body {
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-sm shrink-0">
          <i data-lucide="train" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-base text-slate-900 tracking-tight leading-none">RailAlert</h1>
          <p class="text-[11px] text-slate-500 mt-1 truncate">Live IRCTC PNR Status &amp; Real-Time Alerts</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <!-- Native Audio & Push Alert Permission Toggle -->
        <button id="btn-alert-perm" onclick="requestAlertPermission()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 transition shadow-sm whitespace-nowrap">
          <i data-lucide="bell" class="w-3.5 h-3.5 text-amber-600 shrink-0" id="perm-icon"></i>
          <span id="perm-text" class="hidden sm:inline">Enable Sound &amp; Alerts</span>
          <span id="perm-text-mobile" class="sm:hidden">Alerts</span>
        </button>

        <div id="live-indicator" class="hidden md:flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Live</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

    <!-- Registration Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6">
      <div class="mb-4">
        <h2 class="text-base sm:text-lg font-bold text-slate-900">Check PNR Status</h2>
        <p class="text-xs text-slate-500 mt-0.5">Enter your 10-digit Indian Railways PNR to view seat status and receive automatic real-time updates.</p>
      </div>

      <form id="track-form" onsubmit="handleRegisterPnr(event)">
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1">
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
              10-Digit IRCTC PNR <span class="text-emerald-600">*</span>
            </label>
            <input 
              type="text" 
              id="pnr-input" 
              maxlength="10" 
              placeholder="e.g. 2451234567" 
              required 
              class="w-full text-base sm:text-sm font-mono font-bold tracking-widest border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none placeholder:font-normal placeholder:tracking-normal placeholder:text-slate-400">
          </div>
          <div class="flex items-end">
            <button 
              type="submit" 
              id="btn-submit"
              class="w-full sm:w-auto px-6 py-2.5 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm shadow-emerald-600/30 transition flex items-center justify-center space-x-1.5 min-h-[44px]">
              <i data-lucide="search" class="w-4 h-4"></i>
              <span>Check &amp; Track Status</span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Active Tickets Section -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-xs sm:text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center space-x-2">
          <span>Tracked Tickets</span>
          <span id="ticket-count" class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </h3>

        <button onclick="fetchAllPnrs()" class="text-xs text-slate-500 hover:text-slate-800 font-semibold flex items-center space-x-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Refresh</span>
        </button>
      </div>

      <!-- Tickets Container -->
      <div id="tickets-container" class="space-y-4">
        <!-- Live cards loaded here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden bg-white border border-slate-200 rounded-2xl p-8 sm:p-10 text-center">
        <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
          <i data-lucide="ticket" class="w-6 h-6"></i>
        </div>
        <p class="text-sm font-bold text-slate-700">No active tickets</p>
        <p class="text-xs text-slate-500 mt-1">Enter a 10-digit PNR above to view seat status and get live alerts.</p>
      </div>
    </div>

  </main>

  <!-- Toast Container -->
  <div id="toast-box" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <!-- Client Script -->
  <script>
    let pnrsList = [];

    // Device Identification (Privacy Shield)
    let deviceId = localStorage.getItem('railalert_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
      localStorage.setItem('railalert_device_id', deviceId);
    }

    // Audio Chime (Native Web Audio API)
    function playAlertChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.2, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, now + 0.12);
        gain2.gain.setValueAtTime(0.25, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.55);
      } catch (e) {
        console.warn('Audio notice:', e);
      }
    }

    // Native Browser Notification
    function triggerSystemNotification(title, message) {
      playAlertChime();
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body: message,
              icon: 'https://cdn-icons-png.flaticon.com/512/824/824248.png',
              tag: 'railalert-update'
            });
          } catch (e) {
            console.warn('Notification notice:', e);
          }
        }
      }
    }

    function checkPermissionState() {
      if ('Notification' in window) {
        const btn = document.getElementById('btn-alert-perm');
        const text = document.getElementById('perm-text');
        const textMobile = document.getElementById('perm-text-mobile');
        const icon = document.getElementById('perm-icon');
        if (Notification.permission === 'granted') {
          btn.className = "flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-300 transition shadow-sm cursor-default whitespace-nowrap";
          if (text) text.innerText = "✓ Alerts Active";
          if (textMobile) textMobile.innerText = "✓ Active";
          if (icon) icon.className = "w-3.5 h-3.5 text-emerald-600 shrink-0";
        }
      }
    }

    function requestAlertPermission() {
      playAlertChime();
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          checkPermissionState();
          if (permission === 'granted') {
            showToast('Alerts Enabled', 'You will receive notifications and sound when PNR updates.', true);
            triggerSystemNotification('🚆 RailAlert Active', 'Real-time notifications are active on your device.');
          }
        });
      } else {
        showToast('Notice', 'Sound chime is active.', true);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      checkPermissionState();
      fetchAllPnrs();
      connectSse();
    });

    function showToast(title, msg, isSuccess = true) {
      const box = document.getElementById('toast-box');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto p-3.5 rounded-xl shadow-lg border text-xs flex items-start space-x-2.5 transition-all duration-300 transform translate-y-2 opacity-0 ${
        isSuccess ? 'bg-emerald-900 text-white border-emerald-800' : 'bg-rose-900 text-white border-rose-800'
      }`;
      toast.innerHTML = `
        <i data-lucide="${isSuccess ? 'check-circle-2' : 'alert-circle'}" class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5"></i>
        <div class="min-w-0">
          <p class="font-bold">${title}</p>
          <p class="opacity-90 mt-0.5 leading-snug break-words">${msg}</p>
        </div>
      `;
      box.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    }

    function connectSse() {
      const eventSource = new EventSource('/api/events?deviceId=' + encodeURIComponent(deviceId));
      
      eventSource.addEventListener('pnr_added', (e) => {
        const pnrObj = JSON.parse(e.data);
        showToast('Ticket Added', `PNR ${pnrObj.pnr} added to tracking.`, true);
        triggerSystemNotification(`🚆 PNR ${pnrObj.pnr}`, `Now monitoring Train ${pnrObj.trainNumber}.`);
        fetchAllPnrs();
      });

      eventSource.addEventListener('pnr_update', (e) => {
        const d = JSON.parse(e.data);
        showToast(`PNR ${d.pnr.pnr} Updated!`, d.changeSummary, true);
        triggerSystemNotification(`🚨 PNR ${d.pnr.pnr} Status Changed`, d.changeSummary);
        fetchAllPnrs();
      });

      eventSource.addEventListener('pnr_updated', () => fetchAllPnrs());
      eventSource.addEventListener('pnr_deleted', () => fetchAllPnrs());
    }

    async function fetchAllPnrs() {
      try {
        const res = await fetch('/api/pnr', {
          headers: { 'X-Device-Id': deviceId }
        });
        const data = await res.json();
        if (data.success) {
          pnrsList = data.pnrs || [];
          renderTickets();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function handleRegisterPnr(e) {
      e.preventDefault();
      const pnr = document.getElementById('pnr-input').value.trim();

      if (!pnr || pnr.length !== 10) {
        showToast('Invalid PNR', 'Please enter a valid 10-digit PNR number.', false);
        return;
      }

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(() => checkPermissionState());
      }
      playAlertChime();

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'Checking IRCTC...';

      try {
        const res = await fetch('/api/pnr', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Device-Id': deviceId
          },
          body: JSON.stringify({ pnr, deviceId })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Status Retrieved', `Train ${data.pnr.trainNumber} - ${data.pnr.trainName}`, true);
          document.getElementById('track-form').reset();
          fetchAllPnrs();
        } else {
          showToast('Notice', data.error || 'Failed to fetch PNR', false);
        }
      } catch (err) {
        showToast('Error', err.message, false);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="search" class="w-4 h-4"></i><span>Check &amp; Track Status</span>`;
        lucide.createIcons();
      }
    }

    async function checkPnrNow(pnr) {
      try {
        const res = await fetch(`/api/pnr/${pnr}/check`, { 
          method: 'POST',
          headers: { 'X-Device-Id': deviceId }
        });
        const data = await res.json();
        if (data.success) {
          if (data.diff?.hasChanged) {
            showToast('Update Found!', data.diff.changeSummary, true);
            triggerSystemNotification(`🚨 PNR ${pnr} Updated!`, data.diff.changeSummary);
          } else {
            showToast(`PNR ${pnr}`, 'Status is up to date.', true);
          }
          fetchAllPnrs();
        } else {
          showToast('Notice', data.error || 'Check failed', false);
        }
      } catch (err) {
        showToast('Error', err.message, false);
      }
    }

    async function deletePnr(pnr) {
      if (!confirm(`Remove PNR ${pnr}?`)) return;
      try {
        const res = await fetch(`/api/pnr/${pnr}`, { 
          method: 'DELETE',
          headers: { 'X-Device-Id': deviceId }
        });
        const data = await res.json();
        if (data.success) {
          showToast('Removed', `PNR ${pnr} removed.`, true);
          fetchAllPnrs();
        }
      } catch (err) {
        showToast('Error', err.message, false);
      }
    }

    function renderTickets() {
      const container = document.getElementById('tickets-container');
      const emptyState = document.getElementById('empty-state');
      document.getElementById('ticket-count').innerText = pnrsList.length;

      if (!pnrsList || pnrsList.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = pnrsList.map(p => {
        const passengersHtml = (p.passengers || []).map(pass => `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between text-xs py-2 px-3 bg-slate-50 rounded-xl border border-slate-200/70 gap-1.5">
            <div class="flex items-center justify-between sm:justify-start space-x-2">
              <span class="font-bold text-slate-800">Passenger ${pass.number}</span>
              <span class="text-slate-500 text-[11px]">(Booked: ${pass.bookingStatus})</span>
            </div>
            <div class="flex items-center flex-wrap gap-1.5">
              <span class="font-extrabold px-2 py-0.5 rounded-md ${
                pass.currentStatus.includes('CNF') ? 'bg-emerald-100 text-emerald-800' :
                pass.currentStatus.includes('RAC') ? 'bg-amber-100 text-amber-800' :
                'bg-rose-100 text-rose-800'
              }">
                ${pass.currentStatus}
              </span>
              ${pass.coach ? `
                <span class="font-bold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200 text-[11px]">
                  Coach ${pass.coach}, Seat ${pass.berth} (${pass.berthType || 'Berth'})
                </span>
              ` : '<span class="text-slate-400 italic text-[11px]">Seat pending chart</span>'}
            </div>
          </div>
        `).join('');

        return `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between gap-3 bg-slate-50/50">
              <div class="flex items-center space-x-3 min-w-0">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-emerald-100 text-emerald-800 font-extrabold flex items-center justify-center text-xs shrink-0">
                  ${p.class || '3A'}
                </div>
                <div class="min-w-0">
                  <div class="flex items-center flex-wrap gap-1.5">
                    <span class="font-mono font-extrabold text-sm sm:text-base text-slate-900 tracking-wider">PNR: ${p.pnr}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                      p.chartPrepared ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                    }">
                      ${p.chartPrepared ? '✓ Chart Prepared' : 'Chart Not Prepared'}
                    </span>
                  </div>
                  <p class="text-xs text-slate-600 font-medium mt-0.5 truncate">Train ${p.trainNumber} &bull; ${p.trainName}</p>
                </div>
              </div>
            </div>

            <!-- Ticket Body -->
            <div class="p-4 sm:p-5 space-y-4">
              <div class="grid grid-cols-2 gap-2.5 sm:gap-3 text-xs">
                <div>
                  <p class="text-slate-400 font-medium">Route</p>
                  <p class="font-bold text-slate-800 mt-0.5 truncate">${p.fromStation} &rarr; ${p.toStation}</p>
                </div>
                <div>
                  <p class="text-slate-400 font-medium">Date of Journey</p>
                  <p class="font-bold text-slate-800 mt-0.5">${p.dateOfJourney}</p>
                </div>
              </div>

              <!-- Passengers -->
              <div class="space-y-2">
                <p class="text-xs font-bold text-slate-700 uppercase tracking-wider">Passenger Status</p>
                <div class="space-y-1.5">
                  ${passengersHtml}
                </div>
              </div>

              <!-- Action Bar -->
              <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                <button onclick="checkPnrNow('${p.pnr}')" class="px-3.5 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition inline-flex items-center space-x-1.5 min-h-[40px]" title="Check Live Status Now">
                  <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                  <span>Check Status Now</span>
                </button>

                <button onclick="deletePnr('${p.pnr}')" class="px-2.5 py-1.5 text-xs text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition inline-flex items-center space-x-1" title="Delete Ticket">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  <span>Remove</span>
                </button>
              </div>

            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }
  </script>
</body>
</html>
