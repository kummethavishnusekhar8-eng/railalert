<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>LivePNRAlert — Live IRCTC PNR Status</title>
  <!-- PWA Manifest & App Metadata -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LivePNRAlert">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      transition: background-color 0.15s ease, border-color 0.15s ease;
      box-sizing: border-box;
    }
    /* Prevent mobile input auto-zoom on iOS */
    @media screen and (max-width: 767px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    html, body {
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2.5 min-w-0 cursor-pointer" onclick="showDashboardView()">
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-sm shrink-0">
          <i data-lucide="train" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-base text-slate-900 tracking-tight leading-none">LivePNRAlert</h1>
          <p class="text-[11px] text-slate-500 mt-1 truncate">Live IRCTC PNR Status &amp; Real-Time Alerts</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <!-- Install PWA App Button (Mobile & Desktop) -->
        <button id="btn-install-app" onclick="triggerPwaInstall()" class="hidden items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-500 transition shadow-sm whitespace-nowrap">
          <i data-lucide="download" class="w-3.5 h-3.5 shrink-0"></i>
          <span class="hidden sm:inline">Install App</span>
          <span class="sm:hidden">Install</span>
        </button>

        <!-- Native Audio & Push Alert Permission Toggle -->
        <button id="btn-alert-perm" onclick="requestAlertPermission()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 transition shadow-sm whitespace-nowrap">
          <i data-lucide="bell" class="w-3.5 h-3.5 text-amber-600 shrink-0" id="perm-icon"></i>
          <span id="perm-text" class="hidden sm:inline">Enable Sound &amp; Alerts</span>
          <span id="perm-text-mobile" class="sm:hidden">Alerts</span>
        </button>

        <div id="live-indicator" class="hidden md:flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Live</span>
        </div>
      </div>
    </div>
  </header>

  <!-- View 1: Main Dashboard View -->
  <main id="dashboard-view" class="max-w-3xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

    <!-- Registration Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6">
      <div class="mb-4">
        <h2 class="text-base sm:text-lg font-bold text-slate-900">Check PNR Status</h2>
        <p class="text-xs text-slate-500 mt-0.5">Enter your 10-digit Indian Railways PNR to view seat status and receive automatic real-time updates.</p>
      </div>

      <form id="track-form" onsubmit="handleRegisterPnr(event)">
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1">
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
              10-Digit IRCTC PNR <span class="text-emerald-600">*</span>
            </label>
            <input 
              type="text" 
              id="pnr-input" 
              maxlength="10" 
              placeholder="e.g. 2451234567" 
              required 
              class="w-full text-base sm:text-sm font-mono font-bold tracking-widest border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none placeholder:font-normal placeholder:tracking-normal placeholder:text-slate-400">
          </div>
          <div class="flex items-end">
            <button 
              type="submit" 
              id="btn-submit"
              class="w-full sm:w-auto px-6 py-2.5 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm shadow-emerald-600/30 transition flex items-center justify-center space-x-1.5 min-h-[44px]">
              <i data-lucide="search" class="w-4 h-4"></i>
              <span>Check &amp; Track Status</span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Active Tickets Section -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-xs sm:text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center space-x-2">
          <span>Tracked Tickets</span>
          <span id="ticket-count" class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </h3>

        <button onclick="fetchAllPnrs()" class="text-xs text-slate-500 hover:text-slate-800 font-semibold flex items-center space-x-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Refresh</span>
        </button>
      </div>

      <!-- Tickets Container -->
      <div id="tickets-container" class="space-y-4">
        <!-- Live cards loaded here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden bg-white border border-slate-200 rounded-2xl p-8 sm:p-10 text-center">
        <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
          <i data-lucide="ticket" class="w-6 h-6"></i>
        </div>
        <p class="text-sm font-bold text-slate-700">No active tickets</p>
        <p class="text-xs text-slate-500 mt-1">Enter a 10-digit PNR above to view seat status and get live alerts.</p>
      </div>
    </div>

  </main>

  <!-- View 2: Full-Page Train & PNR Details View -->
  <main id="details-view" class="max-w-3xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-5 hidden">
    <!-- Top Back Bar -->
    <div class="flex items-center justify-between gap-2">
      <button onclick="showDashboardView()" class="inline-flex items-center space-x-2 text-xs sm:text-sm font-bold text-slate-700 bg-white border border-slate-200 px-3.5 py-2 rounded-xl shadow-sm hover:bg-slate-50 transition min-h-[40px]">
        <i data-lucide="arrow-left" class="w-4 h-4 text-emerald-600"></i>
        <span>&larr; Back to Tickets</span>
      </button>

      <button id="btn-details-refresh" onclick="refreshCurrentDetails()" class="inline-flex items-center space-x-1.5 text-xs font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 px-3.5 py-2 rounded-xl hover:bg-emerald-100 transition shadow-sm min-h-[40px]">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-emerald-600" id="details-refresh-icon"></i>
        <span>Check Status Now</span>
      </button>
    </div>

    <!-- Container for dynamic full-page ticket content -->
    <div id="full-details-container" class="space-y-5">
      <!-- Full Page Details Rendered Here -->
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-box" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <!-- Client Script -->
  <script>
    let pnrsList = [];
    let currentDetailPnr = null;

    // Device Identification (Privacy Shield)
    let deviceId = localStorage.getItem('railalert_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
      localStorage.setItem('railalert_device_id', deviceId);
    }

    // Audio Chime (Native Web Audio API)
    function playAlertChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.2, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, now + 0.12);
        gain2.gain.setValueAtTime(0.25, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.55);
      } catch (e) {
        console.warn('Audio notice:', e);
      }
    }

    // Native Browser Notification
    function triggerSystemNotification(title, message) {
      playAlertChime();
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body: message,
              icon: 'https://cdn-icons-png.flaticon.com/512/824/824248.png',
              tag: 'railalert-update'
            });
          } catch (e) {
            console.warn('Notification notice:', e);
          }
        }
      }
    }

    function checkPermissionState() {
      if ('Notification' in window) {
        const btn = document.getElementById('btn-alert-perm');
        const text = document.getElementById('perm-text');
        const textMobile = document.getElementById('perm-text-mobile');
        const icon = document.getElementById('perm-icon');
        if (Notification.permission === 'granted') {
          btn.className = "flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-300 transition shadow-sm cursor-default whitespace-nowrap";
          if (text) text.innerText = "✓ Alerts Active";
          if (textMobile) textMobile.innerText = "✓ Active";
          if (icon) icon.className = "w-3.5 h-3.5 text-emerald-600 shrink-0";
        }
      }
    }

    function requestAlertPermission() {
      playAlertChime();
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          checkPermissionState();
          if (permission === 'granted') {
            showToast('Alerts Enabled', 'You will receive notifications and sound when PNR updates.', true);
            triggerSystemNotification('🚆 LivePNRAlert Active', 'Real-time notifications are active on your device.');
          }
        });
      } else {
        showToast('Notice', 'Sound chime is active.', true);
      }
    }

    // Days Remaining Calculation Helper
    function getDaysRemaining(dojStr) {
      if (!dojStr) return null;
      const trimmed = String(dojStr).trim();
      let targetDate = null;
      if (/^\d{2}-\d{2}-\d{4}$/.test(trimmed)) {
        const [d, m, y] = trimmed.split('-').map(Number);
        targetDate = new Date(y, m - 1, d);
      } else if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
        const [y, m, d] = trimmed.split('-').map(Number);
        targetDate = new Date(y, m - 1, d);
      } else {
        targetDate = new Date(trimmed);
      }
      if (isNaN(targetDate.getTime())) return null;

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffTime = targetDate - today;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    // PWA Install Prompt Handler
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btn-install-app');
      if (btn) {
        btn.classList.remove('hidden');
        btn.classList.add('inline-flex');
      }
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      const btn = document.getElementById('btn-install-app');
      if (btn) btn.classList.add('hidden');
      showToast('App Installed', 'LivePNRAlert added to your home screen!', true);
    });

    async function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          const btn = document.getElementById('btn-install-app');
          if (btn) btn.classList.add('hidden');
        }
        deferredPrompt = null;
      } else {
        showToast('Install on Phone', 'Tap your browser Share menu (or three dots) and tap "Add to Home screen"', true);
      }
    }

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      checkPermissionState();
      fetchAllPnrs();
      connectSse();
    });

    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.view === 'details' && e.state.pnr) {
        showPnrDetails(e.state.pnr, false);
      } else {
        showDashboardView(false);
      }
    });

    function showToast(title, msg, isSuccess = true) {
      const box = document.getElementById('toast-box');
      box.innerHTML = ''; // Keep only ONE message on screen
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto p-3.5 rounded-xl shadow-lg border text-xs flex items-start space-x-2.5 transition-all duration-300 transform translate-y-2 opacity-0 ${
        isSuccess ? 'bg-emerald-900 text-white border-emerald-800' : 'bg-rose-900 text-white border-rose-800'
      }`;
      toast.innerHTML = `
        <i data-lucide="${isSuccess ? 'check-circle-2' : 'alert-circle'}" class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5"></i>
        <div class="min-w-0">
          <p class="font-bold">${title}</p>
          <p class="opacity-90 mt-0.5 leading-snug break-words">${msg}</p>
        </div>
      `;
      box.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function connectSse() {
      const eventSource = new EventSource('/api/events?deviceId=' + encodeURIComponent(deviceId));
      
      eventSource.addEventListener('pnr_added', () => {
        fetchAllPnrs();
      });

      eventSource.addEventListener('pnr_update', (e) => {
        const d = JSON.parse(e.data);
        showToast(`PNR ${d.pnr.pnr} Updated`, d.changeSummary, true);
        triggerSystemNotification(`🚨 PNR ${d.pnr.pnr}`, d.changeSummary);
        fetchAllPnrs();
        if (currentDetailPnr && currentDetailPnr === d.pnr.pnr) {
          renderFullDetails(d.pnr);
        }
      });

      eventSource.addEventListener('pnr_updated', () => fetchAllPnrs());
      eventSource.addEventListener('pnr_deleted', () => fetchAllPnrs());
    }

    async function fetchAllPnrs() {
      try {
        const res = await fetch('/api/pnr', {
          headers: { 'X-Device-Id': deviceId }
        });
        const data = await res.json();
        if (data.success) {
          pnrsList = data.pnrs || [];
          renderTickets();
          if (currentDetailPnr) {
            const updatedDetail = pnrsList.find(p => p.pnr === currentDetailPnr);
            if (updatedDetail) renderFullDetails(updatedDetail);
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function handleRegisterPnr(e) {
      e.preventDefault();
      const pnr = document.getElementById('pnr-input').value.trim();

      if (!pnr || pnr.length !== 10) {
        showToast('Invalid PNR', 'Please enter a valid 10-digit PNR number.', false);
        return;
      }

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(() => checkPermissionState());
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'Checking IRCTC...';

      try {
        const res = await fetch('/api/pnr', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Device-Id': deviceId
          },
          body: JSON.stringify({ pnr, deviceId })
        });
        const data = await res.json();
        if (data.success) {
          playAlertChime();
          const p = data.pnr;
          const statusSummary = (p.passengers || []).map(pass => `P${pass.number}: ${pass.currentStatus}`).join(', ') || 'Active';
          showToast(`Train ${p.trainNumber} - ${p.trainName}`, `Added to tracked tickets! ${statusSummary}`, true);
          document.getElementById('track-form').reset();
          // Stay on normal first screen (dashboard view)
          showDashboardView(false);
          await fetchAllPnrs();
          const ticketsContainer = document.getElementById('tickets-container');
          if (ticketsContainer) {
            ticketsContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        } else {
          showToast('Notice', data.error || 'Failed to fetch PNR', false);
        }
      } catch (err) {
        showToast('Error', err.message, false);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="search" class="w-4 h-4"></i><span>Check &amp; Track Status</span>`;
        lucide.createIcons();
      }
    }

    async function checkPnrNow(pnr, isFromDetails = false) {
      const refreshIcon = document.getElementById('details-refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const res = await fetch(`/api/pnr/${pnr}/check`, { 
          method: 'POST',
          headers: { 'X-Device-Id': deviceId }
        });
        const data = await res.json();
        if (data.success) {
          if (data.diff?.hasChanged) {
            showToast('Update Found!', data.diff.changeSummary, true);
            triggerSystemNotification(`🚨 PNR ${pnr} Updated!`, data.diff.changeSummary);
          } else {
            showToast(`PNR ${pnr}`, 'Live PRS Checked: Status is up to date.', true);
          }
          await fetchAllPnrs();
          if (isFromDetails && data.pnr) {
            renderFullDetails(data.pnr);
          }
        } else {
          showToast('Notice', data.error || 'Check failed', false);
        }
      } catch (err) {
        showToast('Error', err.message, false);
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      }
    }

    function refreshCurrentDetails() {
      if (currentDetailPnr) {
        checkPnrNow(currentDetailPnr, true);
      }
    }

    async function deletePnr(pnr) {
      if (!confirm(`Remove PNR ${pnr}?`)) return;
      try {
        const res = await fetch(`/api/pnr/${pnr}`, { 
          method: 'DELETE',
          headers: { 'X-Device-Id': deviceId }
        });
        const data = await res.json();
        if (data.success) {
          showToast('Removed', `PNR ${pnr} removed.`, true);
          if (currentDetailPnr === pnr) {
            showDashboardView();
          }
          fetchAllPnrs();
        }
      } catch (err) {
        showToast('Error', err.message, false);
      }
    }

    // View Navigation: Switch between Dashboard & Full-Page Details
    function showDashboardView(updateHistory = true) {
      currentDetailPnr = null;
      document.getElementById('details-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (updateHistory) {
        history.pushState({ view: 'dashboard' }, '');
      }
    }

    function showPnrDetails(pnr, updateHistory = true) {
      const ticket = pnrsList.find(p => p.pnr === pnr);
      if (!ticket) return;

      currentDetailPnr = pnr;
      renderFullDetails(ticket);
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('details-view').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (updateHistory) {
        history.pushState({ view: 'details', pnr: pnr }, '');
      }
    }

    // Route Helper Functions
    function isStationMatch(st, targetStation, targetCode) {
      const stationName = typeof st === 'object' ? (st.name || '') : String(st || '');
      const stationCode = typeof st === 'object' ? (st.code || '') : '';
      if (!stationName && !stationCode) return false;
      
      const s = stationName.toLowerCase().replace(/[^a-z0-9]/g, '');
      const sc = stationCode.toLowerCase().replace(/[^a-z0-9]/g, '');
      const t = (targetStation || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const c = (targetCode || '').toLowerCase().replace(/[^a-z0-9]/g, '');

      if (sc && c && sc === c) return true;
      if (c && (s.includes(c) || sc.includes(c))) return true;
      if (t && (s.includes(t) || t.includes(s))) return true;
      
      const tWords = (targetStation || '').toLowerCase().split(/[\s,/-]+/).filter(w => w.length > 3);
      for (const w of tWords) {
        if (s.includes(w)) return true;
      }
      return false;
    }

    function generateRouteTimelineHtml(route, fromStation, toStation, fromCode, toCode) {
      if (!route || route.length === 0) {
        return '<p class="text-xs text-slate-400 italic">Route information not available.</p>';
      }

      let fromIdx = -1;
      let toIdx = -1;

      route.forEach((st, idx) => {
        if (fromIdx === -1 && isStationMatch(st, fromStation, fromCode)) {
          fromIdx = idx;
        }
        if (isStationMatch(st, toStation, toCode)) {
          toIdx = idx;
        }
      });

      return `
        <div class="relative border-l-2 border-slate-200 ml-3 pl-5 my-2 max-h-96 overflow-y-auto pr-2 space-y-4">
          ${route.map((st, idx) => {
            const isBoarding = idx === fromIdx;
            const isDestination = idx === toIdx;
            const isSegment = (fromIdx !== -1 && toIdx !== -1 && idx >= fromIdx && idx <= toIdx);

            const stName = typeof st === 'object' ? st.name : st;
            const stCode = (typeof st === 'object' && st.code) ? st.code : '';
            const stDist = (typeof st === 'object' && st.dist) ? st.dist : '';
            const stArr = (typeof st === 'object' && st.arr) ? st.arr : '';
            const stDep = (typeof st === 'object' && st.dep) ? st.dep : '';
            const stHalt = (typeof st === 'object' && st.halt) ? st.halt : '';

            let dotClass = 'bg-slate-300 border-white';
            let badgeHtml = '';
            let textClass = 'text-slate-700 font-medium text-xs';

            if (isBoarding) {
              dotClass = 'bg-emerald-600 ring-4 ring-emerald-100 border-white';
              textClass = 'text-emerald-950 font-bold text-xs sm:text-sm';
              badgeHtml = '<span class="ml-2 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-100 text-emerald-800 uppercase tracking-wide">Boarding</span>';
            } else if (isDestination) {
              dotClass = 'bg-rose-600 ring-4 ring-rose-100 border-white';
              textClass = 'text-rose-950 font-bold text-xs sm:text-sm';
              badgeHtml = '<span class="ml-2 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-100 text-rose-800 uppercase tracking-wide">Destination</span>';
            } else if (isSegment) {
              dotClass = 'bg-emerald-500 border-white';
              textClass = 'text-slate-900 font-semibold text-xs';
            }

            // Build time badge
            let timeHtml = '';
            if (stArr || stDep) {
              if (stArr === 'Source' || idx === 0) {
                timeHtml = `
                  <div class="flex items-center space-x-1.5 text-[11px] font-mono text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-100 shrink-0">
                    <span class="font-bold">Starts: ${stDep || '05:20'}</span>
                  </div>
                `;
              } else if (stDep === 'Destination' || idx === route.length - 1) {
                timeHtml = `
                  <div class="flex items-center space-x-1.5 text-[11px] font-mono text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-100 shrink-0">
                    <span class="font-bold">Ends: ${stArr || '21:00'}</span>
                  </div>
                `;
              } else {
                timeHtml = `
                  <div class="flex items-center space-x-2 text-[11px] font-mono text-slate-600 bg-white px-2.5 py-1 rounded-lg border border-slate-200/80 shadow-2xs shrink-0">
                    <span class="text-slate-500">Arr: <strong class="text-slate-800">${stArr}</strong></span>
                    <span class="text-slate-300">|</span>
                    <span class="text-slate-500">Dep: <strong class="text-slate-800">${stDep}</strong></span>
                    ${stHalt ? `<span class="px-1.5 py-0.2 rounded bg-slate-100 text-[10px] text-slate-500 font-medium">(${stHalt})</span>` : ''}
                  </div>
                `;
              }
            }

            return `
              <div class="relative group">
                <span class="absolute -left-[27px] top-1.5 w-3.5 h-3.5 rounded-full border-2 ${dotClass} shadow-sm transition-transform group-hover:scale-125"></span>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                  <div class="flex items-center flex-wrap">
                    <span class="text-[11px] font-mono text-slate-400 w-5">${idx + 1}.</span>
                    <span class="${textClass}">${stName}</span>
                    ${stCode ? `<span class="ml-1.5 text-[10px] font-mono font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">${stCode}</span>` : ''}
                    ${stDist ? `<span class="ml-1 text-[10px] text-slate-400">(${stDist})</span>` : ''}
                    ${badgeHtml}
                  </div>
                  ${timeHtml}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    async function loadRouteForPnr(pnr) {
      try {
        const res = await fetch('/api/pnr/' + encodeURIComponent(pnr) + '/route?deviceId=' + encodeURIComponent(deviceId));
        const data = await res.json();
        if (data.success && data.route && data.route.length > 0) {
          const ticket = pnrsList.find(p => p.pnr === pnr);
          if (ticket) {
            ticket.route = data.route;
          }
          if (currentDetailPnr === pnr) {
            const container = document.getElementById('route-timeline-container');
            const countBadge = document.getElementById('route-count-badge');
            if (countBadge) countBadge.innerText = data.route.length + ' Stations';
            if (container && ticket) {
              container.innerHTML = generateRouteTimelineHtml(data.route, ticket.fromStation, ticket.toStation, ticket.fromCode, ticket.toCode);
              lucide.createIcons();
            }
          }
        }
      } catch (e) {
        console.error('Failed to load route:', e);
      }
    }

                  </button>
                </div>

                <button onclick="deletePnr('${p.pnr}')" class="px-2.5 py-1.5 text-xs text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition inline-flex items-center space-x-1" title="Delete Ticket">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  <span>Remove</span>
                </button>
              </div>

            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }
  </script>
</body>
</html>
