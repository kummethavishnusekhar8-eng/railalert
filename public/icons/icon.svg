<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#emeraldGrad)"/>
  <!-- Train Front Silhouette -->
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(64, 56) scale(0.75)">
    <!-- Train Body -->
    <path d="M96 32 C96 14.3 110.3 0 128 0 L384 0 C401.7 0 416 14.3 416 32 L416 320 C416 355.3 387.3 384 352 384 L160 384 C124.7 384 96 355.3 96 320 Z" fill="#ffffff"/>
    <!-- Windshield -->
    <path d="M144 64 L368 64 C376.8 64 384 71.2 384 80 L384 176 C384 184.8 376.8 192 368 192 L144 192 C135.2 192 128 184.8 128 176 L128 80 C128 71.2 135.2 64 144 64 Z" fill="#064e3b"/>
    <!-- Headlights -->
    <circle cx="160" cy="272" r="28" fill="#10b981"/>
    <circle cx="352" cy="272" r="28" fill="#10b981"/>
    <circle cx="160" cy="272" r="14" fill="#ffffff"/>
    <circle cx="352" cy="272" r="14" fill="#ffffff"/>
    <!-- Train Grille / Accent -->
    <rect x="216" y="256" width="80" height="8" rx="4" fill="#064e3b"/>
    <rect x="200" y="276" width="112" height="8" rx="4" fill="#064e3b"/>
    <rect x="224" y="296" width="64" height="8" rx="4" fill="#064e3b"/>
    <!-- Train Track Base -->
    <path d="M64 432 L448 432 C456.8 432 464 439.2 464 448 C464 456.8 456.8 464 448 464 L64 464 C55.2 464 48 456.8 48 448 C48 439.2 55.2 432 64 432 Z" fill="#34d399"/>
    <!-- Wheels -->
    <rect x="120" y="384" width="48" height="40" rx="8" fill="#a7f3d0"/>
    <rect x="344" y="384" width="48" height="40" rx="8" fill="#a7f3d0"/>
  </g>
</svg>
